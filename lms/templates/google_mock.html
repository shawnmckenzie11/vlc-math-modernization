<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Continue with Google · {{ school_name }}</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0b0f19; color: #f8fafc;
      min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
    form { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1);
      padding: 1.5rem; border-radius: 16px; width: min(420px, 92vw); }
    label { display: block; margin: .7rem 0 .3rem; color: #94a3b8; }
    input { width: 100%; padding: .7rem; border-radius: 8px; border: 1px solid #334155;
      background: #111827; color: #fff; box-sizing: border-box; }
    button { margin-top: 1rem; width: 100%; padding: .8rem; border: 0; border-radius: 10px;
      background: #4f46e5; color: #fff; font-weight: 650; cursor: pointer; }
    .hint { color: #94a3b8; font-size: .9rem; }
  </style>
</head>
<body>
  <form method="post" action="{{ url_for('auth_google_callback') }}">
    <p class="hint">Local / mock Google login (set GOOGLE_CLIENT_ID for real OAuth). Portal: {{ portal }}.</p>
    <label for="email">Google email</label>
    <input id="email" name="email" type="email" required placeholder="you@gmail.com" autocomplete="username">
    <label for="name">Name</label>
    <input id="name" name="name" placeholder="Display name">
    <button type="submit">Continue</button>
  </form>
</body>
</html>
