<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Choose class · {{ school_name }}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="wrap">
    <h1>{{ offering.ontario_code }} — more than one live game</h1>
    <p class="sub">Pick the section that is meeting now.</p>
    <form method="post" action="{{ url_for('student_pick') }}">
      {% for g in games %}
      <p>
        <button type="submit" name="class_id" value="{{ g.class_id }}">
          {{ g.class_days }} · {{ g.class_time }}
        </button>
      </p>
      {% endfor %}
    </form>
  </div>
</body>
</html>
