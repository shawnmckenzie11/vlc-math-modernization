# LLOVES LMS — deploy from the repository root so Docker context
# includes courses/, frameworks/, tools/, and scripts/.
#
# Google OAuth: add https://<app>.fly.dev/auth/google/callback
# as an authorized redirect URI, and https://<app>.fly.dev as a JS origin.
#
#   fly deploy
#   fly volumes create lloves_data --region yyz --size 3
#
# Persistent volume holds sqlite + unpacked IMSCC.

app = 'lloves-lms'
primary_region = 'yyz'

[build]
  dockerfile = 'lms/Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

[[mounts]]
  source = 'lloves_data'
  destination = '/data'
