name: Deploy LLOVES LMS

# Commits to main deploy to https://alc.mckenzian.com, but only after the
# LMS test suite passes. Feature branches (LLOVEMS) run tests via ci.yml and
# never deploy; merge to main to release.
#
# Pending the move to a dedicated repo: add the FLY_API_TOKEN secret there
# before the first push to main, or the deploy job fails at the last step.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-lloves-lms
  cancel-in-progress: false

jobs:
  test:
    name: LMS test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r lms/requirements.txt

      - name: Run tests
        env:
          ALLOW_DEV_VERIFICATION_CODE: "1"
        run: |
          failed=0
          for test in lms/test_*.py; do
            echo "::group::$test"
            python "$test" || failed=1
            echo "::endgroup::"
          done
          exit $failed

  deploy:
    name: Deploy to Fly
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard against dev login in production config
        run: |
          if grep -qE "^\s*LOCAL_DEV_LOGIN\s*=\s*['\"]?(1|true|yes)" fly.toml; then
            echo "LOCAL_DEV_LOGIN must never be enabled in fly.toml"
            exit 1
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only
